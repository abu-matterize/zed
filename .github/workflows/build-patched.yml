name: build

on:
  workflow_dispatch:
  push:
    branches:
      - "patched/**"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libfontconfig-dev libvulkan-dev libssl-dev \
            libzstd-dev clang lld

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build -p zed --release

      - uses: actions/upload-artifact@v4
        with:
          name: zed-linux-x86_64
          path: target/release/zed
          if-no-files-found: error
